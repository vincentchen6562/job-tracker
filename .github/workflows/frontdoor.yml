name: Front door

# Publishes frontdoor/, the tracker's permanent public link, to GitHub Pages
# (ADR-0010). It only runs when the page changes.
on:
  push:
    branches: [master]
    paths:
      - frontdoor/**
      - .github/workflows/frontdoor.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontdoor

      - id: deployment
        uses: actions/deploy-pages@v4
